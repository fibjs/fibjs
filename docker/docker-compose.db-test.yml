# fibjs 全数据库测试环境
# 用法:
#   docker compose -f docker/docker-compose.db-test.yml up -d
#   docker compose -f docker/docker-compose.db-test.yml down

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: fibjs-db-test-postgres
    environment:
      POSTGRES_USER: fibjs
      POSTGRES_PASSWORD: fibjs_test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibjs -d test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # MySQL
  mysql:
    image: mysql:8.4
    container_name: fibjs-db-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_test
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Microsoft SQL Server
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fibjs-db-test-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Test_1234"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/1433' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # DM8 (达梦数据库)
  dm8:
    image: sizx/dm8:latest
    container_name: fibjs-db-test-dm8
    environment:
      SYSDBA_PWD: "123456789"
      PAGE_SIZE: 32
      CHARSET: 1
      LENGTH_IN_CHAR: 1
      CASE_SENSITIVE: 0
      BUFFER: 800
      LOG_SIZE: 256
    ports:
      - "5236:5236"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/5236' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
