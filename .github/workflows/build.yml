name: Build/release

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - 'ci/**'
      - 'ci-**'
      - 'releases/**'
      - 'feat/**'
      - 'bugfix/**'
      - 'dev'
      - 'master'
      - 'test_ci'
    tags:
      - v0.*.*
      - v1.*.*
      - test_github_actions_*
  pull_request:
    branches:
      - 'dev'
  # release:
  #   # Only use the types keyword to narrow down the activity types that will trigger your workflow.
  #   types: [published, created, edited]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            type: release
          - os: ubuntu-latest
            arch: ia32
            type: release
          - os: ubuntu-latest
            arch: arm64
            type: release
          - os: ubuntu-latest
            arch: arm
            type: release
          - os: ubuntu-latest
            arch: mips64
            type: release
          - os: ubuntu-latest
            arch: ppc64
            type: release
          - os: ubuntu-latest
            arch: riscv64
            type: release
          - os: ubuntu-latest
            arch: loong64
            type: release
          - os: ubuntu-latest
            arch: loong64ow
            type: release
          - os: ubuntu-latest
            target: alpine
            arch: x64
            type: release
          - os: ubuntu-latest
            target: alpine
            arch: ia32
            type: release
          - os: ubuntu-latest
            target: alpine
            arch: arm64
            type: release
          - os: ubuntu-latest
            target: android
            arch: x64
            type: release
          - os: ubuntu-latest
            target: android
            arch: ia32
            type: release
            test: skip
          - os: ubuntu-latest
            target: android
            arch: arm64
            type: release
          - os: ubuntu-latest
            target: android
            arch: arm
            type: release
            test: skip
          - os: windows-latest
            arch: x64
            type: release
          - os: windows-latest
            arch: ia32
            type: release
          - os: windows-latest
            arch: arm64
            type: release
            test: skip
          - os: macos-latest
            arch: x64
            type: release
          - os: macos-latest
            arch: arm64
            type: release
          - os: macos-latest
            arch: x64
            type: debug
          - os: macos-15
            target: iphone
            arch: arm64
            type: release
            test: skip
          - os: macos-15
            target: iphone-simulator
            arch: arm64
            type: release
          - os: macos-15
            target: iphone-simulator
            arch: x64
            type: release
            test: skip

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up QEMU
        # The runner image has to register the binfmt handlers itself: the
        # ubuntu-latest image is migrating to Ubuntu 26.04 (actions/runner-
        # images#14748, rolling out from 2026-10-19), where the
        # qemu-user-static package no longer exists - it is only a virtual
        # name whose providers are qemu-user-binfmt/qemu-user-binfmt-hwe - so
        # `apt install qemu-user-static` fails as a whole and leaves the
        # runner with no handler at all.  Without one, the cross architecture
        # jobs cannot run their guest binary (docker reports an exec format
        # error and the test step exits 126 after 0s) and the alpine/arm64 job
        # cannot even start its arm64 build image.  This action registers the
        # static emulators for every architecture the matrix needs
        # (arm/arm64/mips64le/ppc64le/riscv64/loong64).  It runs before
        # actions-env.sh so that the android/arm64 handler it re-registers
        # without fix_binary is already present.
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup the environment
        shell: bash
        run: . ./vender/build_tools/scripts/actions-env.sh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TYPE: ${{ matrix.type }}

      - name: Enable AsyncState check
        # CI (branch/PR) builds carry the AsyncState phase lock so that state
        # violations fail the run; release (tag) builds must not - BUILD_TAG
        # is only set for tag builds.
        if: env.BUILD_TAG == ''
        shell: bash
        run: echo "FIBJS_ASYNC_STATE_CHECK=1" >> $GITHUB_ENV

      - name: Build the project
        shell: bash
        run: . ./.github/workflows/build.sh

      - name: Release the project
        if: env.BUILD_TAG != '' && matrix.type == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*
          file_glob: true
          tag: ${{ env.BUILD_TAG }}
          overwrite: true

      - name: Test
        # only test for release version now, some test cases cannot passed in debug mode
        if: ${{ matrix.type == 'release' && matrix.test != 'skip' }}
        shell: bash
        env:
          FORCE_COLOR: '1'
        run: . ./.github/workflows/test.sh
